name: Promote Dev to QA (Auto PR)

on:
  push:
    branches: [main]
    paths:
      - 'infra/environments/dev/**'

env:
  TOFU_VERSION: '1.6.0'

jobs:
  create-qa-pr:
    name: Create QA Promotion PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy dev infrastructure to qa
        run: |
          SOURCE_DIR="infra/environments/dev"
          TARGET_DIR="infra/environments/qa"

          echo "📁 Copying infrastructure from dev to qa"

          # Remove existing files (except .gitkeep and backend.tf)
          find "$TARGET_DIR" -type f ! -name '.gitkeep' ! -name 'backend.tf' -delete 2>/dev/null || true

          # Copy main infrastructure files (excluding backend.tf which is already environment-specific)
          for file in main.tf variables.tf outputs.tf; do
            if [ -f "$SOURCE_DIR/$file" ]; then
              cp "$SOURCE_DIR/$file" "$TARGET_DIR/"
              echo "  ✓ Copied $file"
            fi
          done

          # Generate backend.tf for QA (if it doesn't exist)
          if [ ! -f "$TARGET_DIR/backend.tf" ]; then
            echo "  ✓ Creating backend.tf for QA environment"
            cat > "$TARGET_DIR/backend.tf" << 'EOF'
          # Terraform backend configuration for remote state
          # State is stored in Azure Storage Account
          # Run ../../bootstrap-state-storage.sh first to create the storage infrastructure

          terraform {
            backend "azurerm" {
              resource_group_name  = "rg-vincepreso-tfstate"
              storage_account_name = "tfstatevincepreso"
              container_name       = "tfstate"
              key                  = "qa.terraform.tfstate"
              use_oidc             = true
              # tenant_id and client_id are set via ARM_TENANT_ID and ARM_CLIENT_ID environment variables
            }
          }
          EOF
          else
            echo "  ✓ backend.tf already exists for QA"
          fi

          echo ""
          echo "📝 Files in QA environment:"
          ls -la "$TARGET_DIR"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: promote dev infrastructure to qa"
          branch: promote/dev-to-qa
          delete-branch: true
          title: "🚀 Promote Dev to QA"
          body: |
            ## Automated Promotion: Dev → QA

            This PR was automatically created because changes were detected in the dev environment.

            ### Changes Included
            - Infrastructure files copied from `infra/environments/dev/` to `infra/environments/qa/`
            - Environment-specific values updated (environment name, tfstate key)
            - Greeting updated with "(QA)" suffix

            ### What happens when merged
            1. QA infrastructure will be deployed via the deploy-qa workflow
            2. Application will be deployed to the QA Static Web App

            ### Checklist
            - [ ] Review the infrastructure changes
            - [ ] Verify the greeting message is appropriate for QA
            - [ ] Approve and merge to deploy

            ---
            🤖 *Automated by GitHub Actions*
          labels: |
            promotion
            qa
            automated
