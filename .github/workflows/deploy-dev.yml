name: Deploy Dev Environment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      greeting_name:
        description: 'Custom greeting name (optional)'
        required: false
        default: ''

env:
  TOFU_VERSION: '1.6.0'
  WORKING_DIR: 'infra/environments/dev'

jobs:
  infracost:
    name: Infracost Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost
        run: |
          infracost breakdown --path=${{ env.WORKING_DIR }} \
            --format=json \
            --out-file=/tmp/infracost.json

          echo "## 💰 Infrastructure Cost Estimate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          infracost output --path=/tmp/infracost.json --format=table >> $GITHUB_STEP_SUMMARY

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: infracost
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      website_url: ${{ steps.apply.outputs.website_url }}
      static_web_app_name: ${{ steps.apply.outputs.static_web_app_name }}
      api_key: ${{ steps.apply.outputs.api_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize OpenTofu
        working-directory: ${{ env.WORKING_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: tofu init

      - name: Plan Infrastructure
        working-directory: ${{ env.WORKING_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: |
          tofu plan \
            -var="environment=dev" \
            -var="greeting_name=${{ inputs.greeting_name || 'La Crosse Dev' }}" \
            -out=tfplan

      - name: Apply Infrastructure
        id: apply
        working-directory: ${{ env.WORKING_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: |
          tofu apply -auto-approve tfplan

          echo "website_url=$(tofu output -raw website_url)" >> $GITHUB_OUTPUT
          echo "static_web_app_name=$(tofu output -raw static_web_app_name)" >> $GITHUB_OUTPUT
          echo "api_key=$(tofu output -raw api_key)" >> $GITHUB_OUTPUT

  deploy-app:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate config.js
        run: |
          cat > src/config.js << 'EOF'
          window.APP_CONFIG = {
              greetingName: "${{ inputs.greeting_name || 'La Crosse Dev' }}",
              environment: "dev",
              version: "${{ github.sha }}",
              deployTime: "${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}"
          };
          EOF

          cat src/config.js

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ needs.deploy-infrastructure.outputs.api_key }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src"
          skip_app_build: true

      - name: Output Website URL
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Website URL:** ${{ needs.deploy-infrastructure.outputs.website_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "**Greeting:** ${{ inputs.greeting_name || 'La Crosse Dev' }}" >> $GITHUB_STEP_SUMMARY
